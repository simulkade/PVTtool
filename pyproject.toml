[project]
name = "pvt"
version = "0.1.0"
description = "PVT calculations using cubic equations of state for multicomponent mixtures"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = { text = "BSD-2-Clause" }
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pvt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
